name: stenopod

services:
  llm:
    image: quay.io/ramalama/ramalama:latest
    container_name: stenopod-llm
    devices:
      - /dev/dri
    volumes:
      - ./models:/models:ro
    ports:
      - "8081:8080"
    command:
      - llama-server
      - -m
      - /models/qwen2.5-3b-instruct-q4_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - -c
      - "4096"
      - --jinja
    restart: unless-stopped

  app:
    build:
      context: ./app
    container_name: stenopod-app
    ports:
      - "8780:8080"
    environment:
      LLM_URL: http://llm:8080
      DATA_DIR: /data
      AUTO_SUMMARY_CHARS: "1800"
      AUTO_SUMMARY_SECONDS: "90"
    volumes:
      - ./data:/data
    depends_on:
      - llm
    restart: unless-stopped
